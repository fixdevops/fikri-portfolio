<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Letter F (left) -->
  <text x="130" y="350" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="800" fill="white" letter-spacing="-8">F</text>

  <!-- Letter A (right, slightly overlapping) -->
  <text x="270" y="350" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="800" fill="white" letter-spacing="-8">A</text>

  <!-- Subtle accent line -->
  <rect x="180" y="390" width="200" height="12" rx="6" fill="rgba(255,255,255,0.35)"/>
</svg>
